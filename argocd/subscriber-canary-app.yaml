apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: subscriber-canary
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/<TU_USUARIO>/charts.git'
    targetRevision: main
    path: charts/subscriber
    helm:
      valueFiles:
        - values-canary.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
