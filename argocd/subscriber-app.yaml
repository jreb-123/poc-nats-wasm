apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: subscriber-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jreb-123/poc-nats-wasm.git
    targetRevision: HEAD
    path: charts/subscriber
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
